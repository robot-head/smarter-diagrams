<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smarter Diagrams · Rust/Wasm example</title>
<link rel="icon" type="image/svg+xml" href="./logo.svg">
<style>
:root{font-family:system-ui,sans-serif;color:#24364b;background:#f6f8fb}body{margin:24px}h1{font-size:22px}nav{display:flex;gap:8px;align-items:center;margin-bottom:16px}button{padding:8px 14px;border:1px solid #bdcbdc;border-radius:6px;background:white;cursor:pointer}main{display:grid;grid-template-columns:minmax(280px,1fr) 2fr;gap:16px}textarea{box-sizing:border-box;width:100%;height:560px;padding:16px;border:1px solid #c4d0df;border-radius:8px;font:13px/1.6 ui-monospace,monospace}#canvas{overflow:auto;min-height:560px;background:white;border:1px solid #d6dfeb;border-radius:8px;padding:16px}svg{max-width:100%;height:auto;touch-action:none}[data-node]{cursor:grab}#status{font-size:13px;white-space:pre-wrap}#metrics{font:12px ui-monospace,monospace}@media(max-width:760px){main{grid-template-columns:1fr}}
</style>
<style>nav{flex-wrap:wrap}nav label{display:flex;align-items:center;gap:8px}nav input{max-width:120px}select{max-width:100%;padding:8px;border:1px solid #bdcbdc;border-radius:6px;background:white;color:inherit}section{min-width:0}a{color:#176e62}#download{padding:8px 0}textarea:focus-visible,button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #168c7b;outline-offset:3px}.demo-links{display:flex;gap:18px;flex-wrap:wrap}@media(max-width:760px){body{margin:16px}textarea{height:400px}#canvas{min-height:420px}nav{gap:10px}h1{margin-bottom:12px}}</style>
<h1>Smarter Diagrams</h1><div class="demo-links"><a href="https://robot-head.github.io/smarter-diagrams/">Documentation</a><a href="./advanced.html">Strata and Spatial Git</a></div>
<p>Author topology in text. Drag a node to write a semantic constraint back into the source. Shift-click a connector to cut it during simulation.</p>
<nav><button id="render">Render</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="simulate">Run simulation</button><select id="trace" aria-label="Protocol trace"></select><button id="next">Next step</button><label>Ingress <input id="load" type="range" min="0" max="300" value="80"></label><a id="download" download="diagram.svg">Download SVG</a></nav>
<main><section><label for="source">Diagram source</label><textarea id="source" spellcheck="false">client: Client @sim(rate: 80, service_rate: 200)
gateway: API gateway @sim(service_rate: 100, queue_cap: 200)
worker: Worker @sim(service_rate: 50, queue_cap: 100, retry: exp_backoff(0.5, 0.2))
db: Database @sim(service_rate: 80)
client.E -> gateway.W: HTTPS
gateway.E -> worker.W: jobs
worker.E -> db.W: writes
flow request { client -> gateway -> worker -> db }
</textarea><p id="status" role="status">Loading Rust/Wasm…</p><pre id="metrics"></pre></section><section id="canvas" aria-label="Diagram canvas"></section></main>
<script type="module">
import init,{WasmDocument} from './pkg/smarter_diagrams.js';
const source=document.querySelector('#source'),canvas=document.querySelector('#canvas'),status=document.querySelector('#status');
let doc,worker,objectUrl,timer,drag,focus;let traceStep=-1;const cuts=new Set();
function paint(){traceStep=-1;const select=document.querySelector('#trace');select.replaceChildren();for(const flow of JSON.parse(doc.flows_json())){const option=document.createElement('option');option.value=flow.id;option.textContent=flow.label;select.append(option);}canvas.innerHTML=doc.svg();source.value=doc.source();status.textContent=`${Number(doc.revision())} · source revision`;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(new Blob([doc.svg()],{type:'image/svg+xml'}));document.querySelector('#download').href=objectUrl;}
function render(){try{if(doc)doc.replace_source(doc.revision(),source.value);else doc=new WasmDocument(source.value);paint();if(worker)worker.postMessage({type:'open',source:doc.source()});}catch(e){status.textContent=String(e);}}
await init();
const example=new URLSearchParams(location.search).get('example');
if(example){try{if(!/^[a-z0-9_-]+$/.test(example))throw new Error('Invalid example name');const response=await fetch(new URL(`../examples/${example}.diagram`,location.href));if(!response.ok)throw new Error('Example unavailable');source.value=await response.text();}catch(error){status.textContent=String(error);}}
render();
document.querySelector('#render').onclick=render;
document.querySelector('#next').onclick=()=>{try{const id=document.querySelector('#trace').value;const flow=JSON.parse(doc.flows_json()).find(f=>f.id===id);if(!flow?.edges.length)return;traceStep=(traceStep+1)%flow.edges.length;canvas.innerHTML=doc.flow_frame_svg(id,traceStep);status.textContent=`${flow.label}: step ${traceStep+1}/${flow.edges.length}`;}catch(e){status.textContent=String(e);}};
source.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(render,200);});
document.querySelector('#undo').onclick=()=>{if(doc.undo())paint();};document.querySelector('#redo').onclick=()=>{if(doc.redo())paint();};
canvas.addEventListener('click',e=>{const edge=e.target.closest('[data-edge]');if(!worker||!e.shiftKey||!edge)return;const id=edge.dataset.edge;if(cuts.has(id))cuts.delete(id);else cuts.add(id);worker.postMessage({type:'sever',edge:id,severed:cuts.has(id)});edge.style.stroke=cuts.has(id)?'#d5484b':'';edge.style.strokeDasharray=cuts.has(id)?'4 4':'';status.textContent=cuts.has(id)?`Cut: ${id}`:`Restored: ${id}`;});
canvas.addEventListener('pointerover',e=>{const node=e.target.closest('[data-node]')?.dataset.node;if(!drag&&node&&node!==focus){focus=node;canvas.innerHTML=doc.focus_svg(node,1);}});
canvas.addEventListener('pointerleave',()=>{if(!drag&&focus){focus=undefined;canvas.innerHTML=doc.svg();}});
canvas.addEventListener('pointerdown',e=>{const group=e.target.closest('[data-node]');if(!group)return;drag={node:group.dataset.node,pointer:e.pointerId};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',e=>{if(!drag)return;try{const svg=canvas.querySelector('svg');const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());doc.drag(JSON.stringify([{node:drag.node,position:{x:p.x,y:p.y}}]));paint();}catch(error){status.textContent=String(error);}drag=undefined;});
document.querySelector('#simulate').onclick=()=>{if(worker){worker.postMessage({type:'stop'});worker.terminate();worker=undefined;document.querySelector('#simulate').textContent='Run simulation';return;}worker=new Worker('./simulation-worker.js',{type:'module'});worker.onmessage=({data})=>{if(data.type==='error'){status.textContent=data.message;return;}document.querySelector('#metrics').textContent=Object.entries(data.state.nodes).map(([id,q])=>`${id}: queue ${q.queued.toFixed(1)}, saturation ${(q.saturation*100).toFixed(0)}%, drops ${q.dropped.toFixed(1)}`).join('\n');};worker.postMessage({type:'open',source:source.value});document.querySelector('#simulate').textContent='Stop simulation';};
document.querySelector('#load').oninput=e=>{if(worker)worker.postMessage({type:'rate',node:'client',rate:Number(e.target.value)});};
</script>
