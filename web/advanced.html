<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spatial tools · Smarter Diagrams</title><link rel="icon" type="image/svg+xml" href="./logo.svg">
<style>body{font:14px system-ui;margin:24px;color:var(--sd-fg,#24364b);background:var(--sd-surface,#f6f8fb)}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}textarea{box-sizing:border-box;width:100%;height:230px;padding:12px;font:12px/1.5 monospace}section{background:var(--sd-bg,#ffffff);border:1px solid #d5dfeb;border-radius:8px;padding:16px}svg{max-width:100%;height:auto}#stack{min-height:240px}input{width:60%}@media(max-width:800px){main{grid-template-columns:1fr}}</style>
<link rel="stylesheet" href="./diagram-palette.css"><script src="./theme.js"></script>
<link rel="stylesheet" href="./diagram-viewport.css">
<h1>Spatial tools</h1><button id="theme-toggle" aria-label="Toggle dark theme" aria-pressed="false">Theme</button><a href="./">Back to authoring</a> · <a href="https://robot-head.github.io/smarter-diagrams/runtime/spatial.html">Documentation</a><p id="status" role="status">Loading runtime…</p><main><section><h2>Independent strata</h2><details class="source-panel"><summary>Strata source</summary><textarea id="strata" aria-label="Strata source">strata [app, hardware]
api [stratum: app]
worker [stratum: app]
host [stratum: hardware]
api -> worker: RPC
api -> host [relation: runs_on]
worker -> host [relation: runs_on]
</textarea></details><p><label>Tilt <input id="tilt" type="range" min="0" max="0.785398" step="0.01" value="0.4"></label></p><div id="stack-controls"></div><div id="stack" aria-describedby="stack-legend"></div><p id="stack-legend" class="stack-legend">Solid arrows connect services within a stratum. Dashed arrows cross strata; their labels name the relationship.</p></section><section><h2>Spatial Git</h2><details class="source-panel"><summary>Base and proposal source</summary><label>Base<textarea id="base">client -> api
api -> db
</textarea></label><label>Proposal<textarea id="proposal">client -> api
api -> db
api -> worker
</textarea></label></details><p><label>Branch morph <input id="morph" type="range" min="0" max="1" step="0.01" value="1"></label></p><div id="diff-controls"></div><div id="diff"></div></section></main>
<script type="module">
import {DiagramViewport} from './diagram-viewport.js';
import init,{stack_json,branch_diff_svg} from './pkg-runtime/smarter_diagrams.js';import{StackRenderer}from'./stack-renderer.js';
const stackView=new DiagramViewport(document.querySelector('#stack'),document.querySelector('#stack-controls'),'Independent strata');const diffView=new DiagramViewport(document.querySelector('#diff'),document.querySelector('#diff-controls'),'Branch comparison');for(const panel of document.querySelectorAll('.source-panel'))panel.open=!matchMedia('(max-width:800px)').matches;
await init();const renderer=new StackRenderer(document.querySelector('#stack'),(stage,bounds)=>stackView.attach(stage,bounds));try{await renderer.initialize();}catch(e){renderer.device=undefined;console.warn('WebGPU unavailable',String(e));}
let pending=Promise.resolve();function update(){pending=pending.then(async()=>{try{await renderer.draw(JSON.parse(stack_json(document.querySelector('#strata').value,Number(document.querySelector('#tilt').value))));document.querySelector('#diff').innerHTML=branch_diff_svg(document.querySelector('#base').value,document.querySelector('#proposal').value,Number(document.querySelector('#morph').value));diffView.attach(document.querySelector('#diff svg'));document.querySelector('#status').textContent=`${renderer.mode} · independent planes and branch union ready`;}catch(e){document.querySelector('#status').textContent=String(e);}});}
addEventListener('diagram-theme-change',()=>update());
for(const input of document.querySelectorAll('textarea,input'))input.addEventListener('input',update);update();
</script>
