name: Pages Build
on:
  workflow_call:
    inputs:
      upload_artifact:
        description: Upload GitHub Pages artifact for deployment
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: cargo build --locked --all-features
      - name: Install pinned wasm-bindgen CLI
        run: |
          curl -fL --retry 3 https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz -o /tmp/wasm-bindgen.tar.gz
          echo '9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f  /tmp/wasm-bindgen.tar.gz' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/diagram-wasm-bindgen"
          tar -xzf /tmp/wasm-bindgen.tar.gz --strip-components=1 -C "$RUNNER_TEMP/diagram-wasm-bindgen"
          echo "$RUNNER_TEMP/diagram-wasm-bindgen" >> "$GITHUB_PATH"
      - run: scripts/build-wasm.sh core && scripts/build-wasm.sh runtime
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings --html-in-header docs/rustdoc-header.html
      - run: npm run docs:check && npm run docs:build
      - name: Select the runner's browser
        run: |
          if command -v google-chrome > /dev/null; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          elif command -v chromium > /dev/null; then
            echo "CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
            chromium --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Check semantic completeness and generated layout geometry
        run: npm run test:layout-preflight && npm run test:layout-audit -- --strict && npm run test:layout-explore -- --strict
      - name: Test the complete site under its Pages base path
        run: |
          npm run docs:preview -- --port 4173 > /tmp/diagram-docs-preview.log 2>&1 &
          npm run test:docs
        env:
          DOCS_TEST_URL: http://127.0.0.1:4173/smarter-diagrams/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: documentation-browser-evidence
          path: artifacts/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: inputs.upload_artifact
        with:
          path: site/.vitepress/dist
