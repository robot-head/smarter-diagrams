[package]
name = "smarter-diagrams"
version = "0.1.0"
edition = "2024"
description = "Lossless text-authored diagrams with structured edits and orthogonal layout"
license = "MIT"
repository = "https://github.com/robot-head/smarter-diagrams"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]
wasm-runtime = ["wasm", "verification"]
verification = []
export = ["dep:resvg", "dep:svg2pdf"]
code-bindings = ["dep:tree-sitter", "dep:tree-sitter-rust"]

[dependencies]
rowan = "0.16"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
rstar = "0.12"
delaunator = "1"
resvg = { version = "0.45", optional = true }
svg2pdf = { version = "0.13", optional = true }
tree-sitter = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[[bin]]
name = "smarter-diagrams"
path = "src/main.rs"

[[bench]]
name = "pipeline"
harness = false

[profile.wasm]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
