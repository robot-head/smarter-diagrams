services:
  kroki:
    image: yuzutech/kroki:latest@sha256:e8860a4abf233b706e8979e54266599713f254a7e695ff927c85f0c7043e34ab
    ports:
      - "8000:8000"
    environment:
      KROKI_SAFE_MODE: "secure"
    depends_on:
      - smarterdiagrams

  smarterdiagrams:
    build:
      context: ../..
      dockerfile: extensions/kroki/Dockerfile
    ports:
      - "8008:8008"
