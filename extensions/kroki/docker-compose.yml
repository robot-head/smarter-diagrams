services:
  kroki:
    image: yuzutech/kroki:latest@sha256:de0f2fdc42e926d54706ac962aa5cfb38c5c387035a1b30d07ce297bbc37057b
    ports:
      - "8000:8000"
    environment:
      KROKI_SAFE_MODE: "secure"
    depends_on:
      - smarterdiagrams

  smarterdiagrams:
    build:
      context: ../..
      dockerfile: extensions/kroki/Dockerfile
    ports:
      - "8008:8008"
