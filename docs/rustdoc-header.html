<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--font-family:"Host Grotesk",ui-sans-serif,system-ui,-apple-system,sans-serif;--font-family-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
#sd-docs-return{position:fixed;z-index:10000;top:0;left:0;right:0;min-height:36px;box-sizing:border-box;padding:8px 18px;background:var(--main-background-color,#fff);color:var(--main-color,#111);border-bottom:1px solid var(--table-border-color,#e4e4e7);font:500 13px/20px "Host Grotesk",ui-sans-serif,system-ui,sans-serif}#sd-docs-return a{color:#1a4be0;text-decoration:none;font-weight:600}#sd-docs-return a:hover{text-decoration:underline}:root[data-theme="dark"] #sd-docs-return a{color:#7aa2ff}body{padding-top:44px}.sidebar{top:44px;height:calc(100vh - 44px)}
@media(max-width:480px){#sd-docs-return span{display:none}}
</style>
<script>
(()=>{try{const saved=localStorage.getItem('vitepress-theme-appearance');if(saved==='dark'||saved==='light'){localStorage.setItem('rustdoc-theme',saved);localStorage.setItem('rustdoc-use-system-theme','false');document.documentElement.dataset.theme=saved}}catch{}
const base=location.pathname.split('/api/')[0]+'/';
const icon=document.createElement('link');icon.rel='icon';icon.type='image/svg+xml';icon.href=base+'favicon.svg';document.head.append(icon);
addEventListener('DOMContentLoaded',()=>{const nav=document.createElement('nav');nav.id='sd-docs-return';nav.setAttribute('aria-label','Documentation navigation');const link=document.createElement('a');link.href=base+'guide/getting-started.html';link.textContent='← Smarter Diagrams documentation';const label=document.createElement('span');label.textContent=' · Rust API';nav.append(link,label);document.body.prepend(nav);
new MutationObserver(()=>{const theme=document.documentElement.dataset.theme;if(theme==='dark'||theme==='light'){try{localStorage.setItem('vitepress-theme-appearance',theme)}catch{}}}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});});})();
</script>
